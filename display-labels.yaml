# Friendly story labels for the consumer-tier dashboard
#
# One row per signal_id (the stable database key from the signal store).
# The generator script (generate_consumer_index.py) reads this file and uses
# `label` for cards and the story-map timeline; `one_line` for hover/expansion;
# `sentiment_override` to force a dot color when the summary's dominant
# sentiment misrepresents the story; `retired_alias[]` for backward-lookup
# when slugs evolve (per v1.17 stability mandate, slugs never change after
# minting — but display labels can).
#
# Schema:
#   - signal_id:        STRING  (the canonical slug, lowercase-hyphen)
#     label:            STRING  (consumer-tier display name; sentence case)
#     one_line:         STRING  (one-sentence plain-English explainer)
#     sentiment_override: ENUM  (sn|cn|mx|cp|sp — optional; null = use summary default)
#     retired_alias:    LIST    (optional; prior labels for backward lookup)
#
# Sentiment buckets (encoded as dot color in the story-map):
#   sn = strongly negative (deep red, #A32D2D)
#   cn = cautiously negative (coral, #E24B4A)
#   mx = mixed / nuanced (gray, #888780)
#   cp = cautiously positive (light green, #97C459)
#   sp = strongly positive (deep green, #3B6D11)
#
# When the Analysis Engine mints a new signal slug, add a row here BEFORE the
# next Step 7 (consumer dashboard) run. If a row is missing, the generator
# falls back to title-casing the slug and emits a WARNING.

version: "1.1"
